# Local infrastructure, the API, and the telemetry worker.
#
#   docker compose up --build                       API + worker + Postgres + Mosquitto
#   docker compose --profile simulator up --build   ...plus 3 simulated drones flying missions
#
# The API sends drone commands over MQTT (DRONE_LINK=mqtt), so a dispatch only succeeds
# while something plays the drones: start the simulator profile, or real drones.
# Redis holds the live view (latest drone state, alerts): optional and never authoritative.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone
      POSTGRES_DB: drone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # No persistence: the live view is rebuilt from the drones' next samples.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Inside the compose network the hosts are the service names, not localhost.
      DATABASE_URL: postgresql+asyncpg://drone:drone@postgres:5432/drone
      DRONE_LINK: mqtt
      MQTT_URL: mqtt://mosquitto:1883
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    # Apply migrations, then serve. In production run migrations as a separate release step.
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Records what drones report (order progress, flight completion, docking, telemetry), runs
  # the watchdog and the reaper. Run exactly one.
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://drone:drone@postgres:5432/drone
      MQTT_URL: mqtt://mosquitto:1883
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]

  # Plays the drones: registers sim-1..sim-3 with the API and flies the missions it is sent.
  simulator:
    build: .
    profiles: ["simulator"]
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://mosquitto:1883
    command:
      - python
      - -m
      - app.simulator
      - --api-url
      - http://api:8000
      - --fleet
      - "3"
      - --speed-factor
      - "30"

volumes:
  pgdata:
  mosquittodata:
