# Local infrastructure. Phase 2 needs PostgreSQL + PostGIS only.
# Redis and Mosquitto are added in the telemetry phase, the app image in the API phase.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone
      POSTGRES_DB: drone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
