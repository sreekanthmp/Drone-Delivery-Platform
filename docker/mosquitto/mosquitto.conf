# Development broker for the drone delivery platform. NOT for production:
# it accepts anonymous, unencrypted connections, because authentication and TLS have not
# been requested for this project. Put a real broker configuration in front of real drones.
listener 1883
allow_anonymous true

# Keep sessions and queued QoS 1 messages across a broker restart, so the telemetry worker
# does not lose events it was away for.
persistence true
persistence_location /mosquitto/data/
