[project]
name = "drone-delivery-platform"
version = "0.1.0"
description = "B2B drone delivery platform: order intake, dispatch, compliance, telemetry and partner webhooks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added in the phase that first needs them.
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "geoalchemy2>=0.21.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# This is an application, not an installable library.
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires external infrastructure (PostgreSQL, Redis, Mosquitto)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["geoalchemy2", "geoalchemy2.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
